<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bibliotech - Registro</title>
    <link rel="stylesheet" href="../css/w3.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" href="../img/favicon.png">
</head>
<body class="w3-display-container" style="height:100vh;">
    <div class="w3-display-middle w3-mobile" style="width:400px;">
        <div class="w3-card-4 vault-card w3-padding-large w3-round-large">
            <h2 class="w3-center w3-text-yellow"><b>CREAR CUENTA</b></h2>
            <form id="registerForm">
                <label>Usuario</label>
                <input class="w3-input w3-border w3-round w3-black w3-text-white" type="text" id="username" required>
                <label>Nombre</label>
                <input class="w3-input w3-border w3-round w3-black w3-text-white" type="text" id="firstName" required>
                <label>Apellido</label>
                <input class="w3-input w3-border w3-round w3-black w3-text-white" type="text" id="lastName" required>
                <label>DNI</label>
                <input class="w3-input w3-border w3-round w3-black w3-text-white" type="text" id="dni" required>
                <label>Email</label>
                <input class="w3-input w3-border w3-round w3-black w3-text-white" type="email" id="email" required>
                <label>Teléfono</label>
                <input class="w3-input w3-border w3-round w3-black w3-text-white" type="tel" id="phone" required>
                <label>Fecha de nacimiento</label>
                <input class="w3-input w3-border w3-round w3-black w3-text-white" type="date" id="birthDate" required>
                <label>Carrera</label>
                <select class="w3-select w3-border w3-round w3-black w3-text-white" id="careerId" required>
                    <option value="">Cargando carreras...</option>
                </select>
                <br>
                <label>Contraseña</label>
                <input class="w3-input w3-border w3-round w3-black w3-text-white" type="password" id="password" maxlength="72" autocomplete="new-password" required>
                <label>Repetir contraseña</label>
                <input class="w3-input w3-border w3-round w3-black w3-text-white" type="password" id="confirmPassword" maxlength="72" autocomplete="new-password" required>
                <br>
                <button type="submit" class="w3-button w3-yellow w3-block w3-round-large"><b>REGISTRARSE</b></button>
            </form>
            <p class="w3-small w3-center">¿Ya tienes cuenta? <a href="/login" class="w3-text-yellow">Inicia Sesión</a></p>
        </div>
    </div>

    <script src="../js/services/apiService.js"></script>
    <script src="../js/components/uiHandlers.js"></script>
    <script src="../js/utils/authHelper.js"></script>
    <script src="../js/utils/routeGuard.js"></script>
    <script src="../js/frontControllers/authFrontController.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            RouteGuard.init();
            try {
                const careers = await apiService.request('/auth/careers');
                const select = document.getElementById('careerId');
                select.replaceChildren();
                careers.forEach((career) => {
                    const option = document.createElement('option');
                    option.value = career.id;
                    option.textContent = career.name;
                    select.appendChild(option);
                });
            } catch (error) {
                document.getElementById('careerId').replaceChildren(new Option('No hay carreras disponibles', ''));
            }
        });
    </script>
</body>
</html>
