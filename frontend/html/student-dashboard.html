<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bibliotech - Alumno</title>
    <link rel="stylesheet" href="../css/w3.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main class="w3-container w3-padding-32">
        <div id="tab-materials" class="tab-content">
            <h1 class="w3-text-white">Mis materiales</h1>
            <p class="w3-text-white">Solo se muestran PDFs de clases aprobadas por el profesor.</p>
            <div id="materialsTable" class="vault-card"></div>
        </div>

        <div id="tab-requests" class="tab-content" style="display:none">
            <h1 class="w3-text-white">Solicitudes</h1>
            <p class="w3-text-white">Solicita acceso a clases y sigue el estado de tus solicitudes.</p>

            <h3 class="w3-text-white">Nueva solicitud</h3>
            <div class="w3-row-padding w3-margin-bottom">
                <div class="w3-third">
                    <label class="w3-text-white">Carrera</label>
                    <select id="prefCareer" class="w3-select w3-border w3-round w3-black w3-text-white"></select>
                </div>
                <div class="w3-third">
                    <label class="w3-text-white">Año</label>
                    <select id="prefYear" class="w3-select w3-border w3-round w3-black w3-text-white" disabled></select>
                </div>
                <div class="w3-third">
                    <label class="w3-text-white">Materia</label>
                    <select id="prefSubject" class="w3-select w3-border w3-round w3-black w3-text-white" disabled></select>
                </div>
            </div>

            <div class="w3-margin-bottom">
                <button id="btnRequestClass" class="w3-button w3-yellow w3-round-large" disabled><b>SOLICITAR ACCESO</b></button>
            </div>

            <div id="preferencesInfo" class="w3-panel w3-pale-yellow w3-border w3-round w3-text-dark-grey" style="display:none"></div>

            <hr class="w3-opacity">

            <h3 class="w3-text-white">Mis solicitudes actuales</h3>
            <div id="currentRequestsTable" class="vault-card"></div>
        </div>

        <div id="tab-profile" class="tab-content" style="display:none">
            <h1 class="w3-text-white">Mi perfil</h1>
            <p class="w3-text-white">Consultá y actualizá tus datos personales.</p>
            <div id="profileCard" class="vault-card w3-padding"></div>
        </div>
    </main>

    <script src="../js/services/apiService.js"></script>
    <script src="../js/components/uiHandlers.js"></script>
    <script src="../js/components/modal.js"></script>
    <script src="../js/components/table.js"></script>
    <script src="../js/components/navigation.js"></script>
    <script src="../js/utils/authHelper.js"></script>
    <script src="../js/utils/dateHelper.js"></script>
    <script src="../js/utils/routeGuard.js"></script>
    <script src="../js/frontControllers/materialsFrontController.js"></script>
    <script src="../js/frontControllers/studentFrontController.js"></script>
    <script src="../js/frontControllers/profileFrontController.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            RouteGuard.init(['student']);
            Navigation.renderNavBar('student', 'materials', (tab) => {
                if (tab === 'materials') loadStudentMaterials();
                if (tab === 'requests') studentController.loadRequests();
                if (tab === 'profile') profileController.loadProfile();
            });
        });
    </script>
</body>
</html>
