<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bibliotech - Profesor</title>
    <link rel="stylesheet" href="../css/w3.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main class="w3-container w3-padding-32">
        <div id="tab-materials" class="tab-content">
            <h1 class="w3-text-white">Mis materiales</h1>
            <div class="w3-card-4 vault-card w3-padding w3-margin-bottom">
                <h2 class="w3-text-yellow">Cargar PDF</h2>
                <form id="uploadForm">
                    <label>Título</label>
                    <input class="w3-input w3-border w3-round w3-black w3-text-white" name="title" required>
                    <label>Descripción</label>
                    <textarea class="w3-input w3-border w3-round w3-black w3-text-white" name="description"></textarea>
                    <label>Autor del material</label>
                    <input class="w3-input w3-border w3-round w3-black w3-text-white" name="author">
                    <label>Clases con acceso</label>
                    <select class="w3-select w3-border w3-round w3-black w3-text-white" id="classIds" multiple required></select>
                    <label>PDF (máximo 50 MB)</label>
                    <input class="w3-input w3-border w3-round w3-black w3-text-white" type="file" name="pdfFile" accept="application/pdf" required>
                    <button class="w3-button w3-yellow w3-margin-top w3-round-large" type="submit"><b>CARGAR PDF</b></button>
                </form>
            </div>
            <h2 class="w3-text-white">Mis materiales</h2>
            <div id="materialsTable" class="vault-card"></div>
        </div>

        <div id="tab-requests" class="tab-content" style="display:none">
            <h1 class="w3-text-white">Solicitudes de alumnos</h1>
            <p class="w3-text-white">Gestiona las solicitudes de acceso a tus clases.</p>

            <div id="requestsTable" class="vault-card"></div>
        </div>

        <div id="tab-students" class="tab-content" style="display:none">
            <h1 class="w3-text-white">Mis alumnos</h1>
            <p class="w3-text-white">Alumnos asignados a tus clases activas.</p>
            <div id="studentsTable" class="vault-card"></div>
        </div>

        <div id="tab-my-classes" class="tab-content" style="display:none">
            <h1 class="w3-text-white">Mis Clases</h1>
            <p class="w3-text-white">Clases asignadas a este profesor.</p>
            <div id="myClassesTable" class="vault-card"></div>
        </div>

        <div id="tab-profile" class="tab-content" style="display:none">
            <h1 class="w3-text-white">Mi perfil</h1>
            <p class="w3-text-white">Consultá y actualizá tus datos personales.</p>
            <div id="profileCard" class="vault-card w3-padding"></div>
        </div>
    </main>

    <script src="../js/services/apiService.js"></script>
    <script src="../js/components/uiHandlers.js"></script>
    <script src="../js/components/modal.js"></script>
    <script src="../js/components/table.js"></script>
    <script src="../js/components/navigation.js"></script>
    <script src="../js/utils/authHelper.js"></script>
    <script src="../js/utils/dateHelper.js"></script>
    <script src="../js/utils/routeGuard.js"></script>
    <script src="../js/frontControllers/materialsFrontController.js"></script>
    <script src="../js/frontControllers/professorFrontController.js"></script>
    <script src="../js/frontControllers/profileFrontController.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            RouteGuard.init(['professor']);
            Navigation.renderNavBar('professor', 'materials', (tab) => {
                if (tab === 'requests') professorController.loadRequests();
                if (tab === 'students') professorController.loadStudents();
                if (tab === 'my-classes') professorController.loadMyClasses();
                if (tab === 'profile') profileController.loadProfile();
            });
        });
    </script>
</body>
</html>
